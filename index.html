<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#163e39">
<title>데일리 무브 · 운동 추천 & 스케줄러</title>
<style>
:root{font-family:system-ui,-apple-system,'Malgun Gothic',sans-serif;color:#203734;background:#f2f5f4;font-size:16px;--green:#163e39;--lime:#d9ef83;--muted:#637773;--line:#dde6e3}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #649a3c;outline-offset:3px}button{border:0;border-radius:12px;padding:12px 18px;background:var(--green);color:white;font-weight:700;min-height:44px}button:hover{filter:brightness(1.12)}button.secondary{background:#ecf1ef;color:var(--green)}button.small{padding:9px 12px;font-size:.875rem}header{background:var(--green);color:white}nav{max-width:1180px;margin:auto;padding:24px 28px;display:flex;justify-content:space-between;align-items:center}.brand{font-weight:800;letter-spacing:.03em;font-size:1.2rem}.brand span{color:var(--lime)}.nav-note{font-size:.875rem;color:#d4e1de}main{max-width:1180px;margin:auto;padding:32px 28px}h1{font-size:clamp(1.8rem,4vw,2.6rem);margin:0 0 8px;letter-spacing:-.045em}h2{font-size:1.2rem;margin:0}p{line-height:1.65}.intro{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px}.intro p{margin:0;color:var(--muted)}.date-badge{font-size:.875rem;font-weight:700;white-space:nowrap;color:var(--green)}.layout{display:grid;grid-template-columns:1fr 1.05fr;gap:24px;align-items:start}.card{background:white;border:1px solid var(--line);border-radius:22px;padding:26px;box-shadow:0 5px 18px #163e3904}.section-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px}.eyebrow{font-size:.75rem;font-weight:800;letter-spacing:.13em;color:var(--muted);margin:0 0 6px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-size:.875rem;font-weight:700}select,input{display:block;width:100%;margin-top:8px;border:1px solid #cbd8d3;border-radius:10px;padding:12px;background:#fff;color:#203734;min-width:0}.full{grid-column:1/-1}.recommend{width:100%;margin-top:18px}.result{background:#f3f7f0;border-radius:16px;margin-top:22px;padding:22px}.result-top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:var(--lime);border-radius:30px;padding:7px 11px;font-size:.875rem;font-weight:700;white-space:nowrap}.result h3{margin:0;font-size:1.25rem}.result p{font-size:.875rem;color:var(--muted);margin:8px 0 16px}.exercises{list-style:none;padding:0;margin:0}.exercises li{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #dce5d7;padding:14px 0;font-size:.9375rem}.exercises strong{font-size:.875rem;color:#46613d;white-space:nowrap}.save{width:100%;margin-top:8px}.notice{font-size:.875rem;color:var(--muted);margin:18px 0 0;line-height:1.65}.month-nav{display:flex;align-items:center;gap:8px}.month-nav button{padding:7px 12px;background:#eef3f1;color:var(--green)}#monthTitle{font-size:1rem;min-width:100px;text-align:center}.weekdays,.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.weekdays{font-size:.875rem;text-align:center;color:var(--muted);margin:18px 0 8px}.calendar button{position:relative;padding:10px 0;min-height:44px;background:transparent;color:#354e48;font-weight:500;border-radius:12px}.calendar button.today{box-shadow:inset 0 0 0 1px #779586}.calendar button.selected{background:var(--green);color:white;font-weight:800}.calendar button.has-plan:after{content:'';position:absolute;bottom:4px;left:calc(50% - 2px);width:4px;height:4px;background:#83a93f;border-radius:50%}.calendar button.selected:after{background:var(--lime)}.schedule-heading{border-top:1px solid var(--line);padding-top:22px;margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:8px}.schedule-heading h3{font-size:1rem;margin:0}.count{font-size:.875rem;color:var(--muted)}.empty{background:#f6f8f7;border-radius:14px;text-align:center;padding:26px 14px;color:var(--muted);font-size:.9375rem;margin-top:16px}.empty strong{display:block;color:#38544a;margin-bottom:6px}.plan{margin-top:14px;border:1px solid var(--line);border-radius:14px;padding:16px}.plan.done{background:#f3f7f0}.plan-top{display:flex;justify-content:space-between;gap:10px}.plan h4{margin:0 0 4px;font-size:1rem}.meta{font-size:.875rem;color:var(--muted)}.plan ul{margin:14px 0;padding-left:20px;font-size:.875rem;color:#526961;line-height:1.9}.plan-actions{display:flex;gap:8px}.plan-actions .delete{margin-left:auto;background:transparent;color:#8b5854}.custom{border-top:1px solid var(--line);margin-top:22px;padding-top:20px}.custom summary{cursor:pointer;font-weight:700;font-size:.9375rem;min-height:30px}.custom form{margin-top:14px;display:grid;gap:12px}.custom input{margin:0}.custom-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.footer{margin-top:24px;display:flex;justify-content:space-between;gap:14px;font-size:.875rem;color:var(--muted)}.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#163e39;color:white;padding:14px 22px;border-radius:12px;box-shadow:0 4px 20px #0002;z-index:2;max-width:calc(100% - 32px);text-align:center}.toast:empty{display:none}#storageWarning{color:#914b3b} @media(max-width:800px){.layout{grid-template-columns:1fr}nav{padding:20px}.intro{align-items:start;flex-direction:column;gap:12px}main{padding:24px 16px}.card{padding:21px}.footer{flex-direction:column}.nav-note{font-size:.75rem}}@media(max-width:380px){.fields{grid-template-columns:1fr}.section-top{flex-wrap:wrap}.result-top{flex-wrap:wrap}.exercises li{align-items:start}.exercises strong{white-space:normal;text-align:right}.custom-row{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><nav><div class="brand">daily<span> move.</span></div><div class="nav-note">나만의 운동 루틴</div></nav></header>
<main>
<div class="intro"><div><p class="eyebrow">MY DAILY ROUTINE</p><h1>오늘도, 내 페이스대로.</h1><p>가볍게 추천받고, 운동할 날에 담아보세요.</p></div><div id="todayLabel" class="date-badge"></div></div>
<div class="layout">
<section class="card" aria-labelledby="recommendHeading"><div class="section-top"><h2 id="recommendHeading">오늘의 운동 추천</h2><span class="meta">01 / PLAN</span></div>
<div class="fields"><label>운동 시간<select id="duration"><option value="15">15분 · 짧고 가볍게</option><option value="30" selected>30분 · 꾸준하게</option><option value="45">45분 · 여유 있게</option></select></label><label>운동 장소<select id="place"><option value="home">집 / 야외</option><option value="gym">헬스장</option></select></label><label>운동 방향<select id="goal"><option value="balance">균형 잡힌 루틴</option><option value="cardio">걷기 / 유산소</option><option value="strength">기초 근력</option></select></label><label>오늘의 컨디션<select id="condition"><option value="light" selected>가볍게 움직이고 싶어요</option><option value="normal">보통이에요</option><option value="rest">쉬고 싶어요</option></select></label></div>
<button id="recommend" class="recommend">운동 추천받기</button><div id="result" class="result" aria-live="polite"></div>
<p class="notice">일반적인 운동 예시입니다. 수술 후 회복 중이라면 담당 의료진에게 허용받은 동작만 선택하세요. 무게는 직접 정하고, 불편한 동작은 건너뛰세요.</p>
</section>
<section class="card" aria-labelledby="scheduleHeading"><div class="section-top"><h2 id="scheduleHeading">운동 스케줄</h2><span class="meta">02 / DO</span></div><div class="month-nav"><button id="prev" aria-label="이전 달">‹</button><h3 id="monthTitle"></h3><button id="next" aria-label="다음 달">›</button><button id="goToday" class="small" style="margin-left:auto">오늘</button></div><div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div id="calendar" class="calendar" aria-label="운동 날짜 선택"></div><div class="schedule-heading"><h3 id="selectedTitle"></h3><span id="completion" class="count"></span></div><div id="plans"></div>
<details class="custom"><summary>직접 운동 일정 추가</summary><form id="customForm"><input id="customName" aria-label="운동 이름" placeholder="운동 이름 (예: 저녁 산책)" required maxlength="60"><div class="custom-row"><input id="customTime" type="time" aria-label="운동 시작 시간" value="19:00" required><input id="customMinutes" type="number" aria-label="운동 시간 (분)" placeholder="시간 (분)" value="30" min="1" max="240" required></div><button type="submit" class="secondary">선택한 날짜에 추가</button></form></details>
</section></div>
<div class="footer"><span>기록은 이 브라우저에 저장됩니다. 다른 기기와 자동 동기화되지 않습니다.</span><span id="weekStats"></span></div><p id="storageWarning" class="notice" role="alert"></p>
</main><div id="toast" class="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
const $=id=>document.getElementById(id), KEY='daily-move-v1';
const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const now=new Date(), today=dateKey(now);let selected=today,view=new Date(now.getFullYear(),now.getMonth(),1),records=[],recommendation,toastTimer;
try{const raw=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(raw))throw Error();records=raw.filter(p=>p&&typeof p.id==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(p.date)&&typeof p.name==='string'&&Number.isFinite(p.minutes)&&Array.isArray(p.items)&&p.items.every(x=>typeof x.name==='string'&&typeof x.detail==='string'));}catch{$('storageWarning').textContent='저장된 기록을 읽을 수 없습니다. 새 일정은 현재 화면에서 사용할 수 있습니다.';}
function notify(s){$('toast').textContent=s;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').textContent='',3000)}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(records));return true}catch{$('storageWarning').textContent='브라우저 저장 공간을 사용할 수 없습니다. 현재 기록은 페이지를 닫으면 사라질 수 있습니다.';return false}}
function el(tag,text,cls){const e=document.createElement(tag);if(text!==undefined)e.textContent=text;if(cls)e.className=cls;return e}
function uid(){return globalThis.crypto?.randomUUID?.()||`${Date.now()}-${Math.random().toString(36).slice(2)}`}
function recommend(){const minutes=Number($('duration').value),goal=$('goal').value,place=$('place').value,light=$('condition').value==='light',rest=$('condition').value==='rest';let name,items;
if(rest){name='오늘은 쉬어가는 날';items=[{name:'운동 없이 휴식',detail:'편안하게 쉬기'}]}
else if(light||goal==='cardio'){name=light?'편안한 걷기 루틴':'걷기 중심 유산소';items=[{name:'천천히 걷기 · 준비',detail:'3분'},{name:'편안한 속도로 걷기',detail:`${minutes-6}분`},{name:'천천히 걷기 · 마무리',detail:'3분'}]}
else{const sets=minutes===15?1:minutes===30?2:3;name=goal==='strength'?'기초 근력 루틴':'걷기 + 기초 근력';items=[{name:'가벼운 걷기 · 준비',detail:'3분'},{name:place==='gym'?'가벼운 체스트 프레스':'벽에 기대어 푸시업',detail:`8회 × ${sets}세트`},{name:place==='gym'?'가벼운 랫풀다운':'의자에서 일어나기',detail:`8회 × ${sets}세트`},{name:'서서 뒤꿈치 들기',detail:`10회 × ${sets}세트`},{name:goal==='balance'?'남은 시간 편안하게 걷기':'세트 사이 충분히 쉬기',detail:'시간 내 자유롭게'},{name:'천천히 걷기 · 마무리',detail:'3분'}]}
recommendation={name,minutes:rest?0:minutes,items,place:rest?'휴식':place==='gym'?'헬스장':'집 / 야외'};renderResult()}
function renderResult(){const box=$('result');box.replaceChildren();const top=el('div',undefined,'result-top');top.append(el('h3',recommendation.name),el('span',recommendation.minutes?`${recommendation.minutes}분`:'휴식','pill'));box.append(top,el('p',recommendation.minutes?'횟수보다 편안한 움직임을 우선하세요.':'쉬는 날도 일정에 기록할 수 있어요.'));const ul=el('ul',undefined,'exercises');recommendation.items.forEach(x=>{const li=el('li');li.append(el('span',x.name),el('strong',x.detail));ul.append(li)});box.append(ul);const b=el('button',`${Number(selected.slice(5,7))}월 ${Number(selected.slice(8))}일 일정에 추가`,'save');b.onclick=()=>add({...recommendation,time:'',done:false});box.append(b)}
function add(data){records.push({...data,id:uid(),date:selected});const saved=persist();render();notify(saved?'운동 일정을 저장했어요.':'일정을 추가했지만 브라우저에 저장하지 못했어요.')}
function render(){renderCalendar();renderPlans();renderResult();const start=new Date(now.getFullYear(),now.getMonth(),now.getDate());start.setDate(start.getDate()-((start.getDay()+6)%7));const end=new Date(start);end.setDate(end.getDate()+7);const week=records.filter(p=>p.date>=dateKey(start)&&p.date<dateKey(end));$('weekStats').textContent=`이번 주 ${week.filter(p=>p.done).length} / ${week.length}개 완료`}
function renderCalendar(){$('monthTitle').textContent=`${view.getFullYear()}년 ${view.getMonth()+1}월`;$('calendar').replaceChildren();for(let i=0;i<view.getDay();i++)$('calendar').append(el('span'));const days=new Date(view.getFullYear(),view.getMonth()+1,0).getDate();for(let day=1;day<=days;day++){const key=dateKey(new Date(view.getFullYear(),view.getMonth(),day));const b=el('button',String(day));b.className=[key===today?'today':'',key===selected?'selected':'',records.some(p=>p.date===key)?'has-plan':''].join(' ');b.setAttribute('aria-label',`${view.getFullYear()}년 ${view.getMonth()+1}월 ${day}일${records.some(p=>p.date===key)?', 일정 있음':''}`);b.setAttribute('aria-pressed',String(key===selected));b.onclick=()=>{selected=key;render()};$('calendar').append(b)}}
function renderPlans(){const list=records.filter(p=>p.date===selected).sort((a,b)=>(a.time||'99:99').localeCompare(b.time||'99:99'));$('selectedTitle').textContent=`${Number(selected.slice(5,7))}월 ${Number(selected.slice(8))}일 일정`;$('completion').textContent=list.length?`${list.filter(p=>p.done).length} / ${list.length} 완료`:'';$('plans').replaceChildren();if(!list.length){const empty=el('div',undefined,'empty');empty.append(el('strong','아직 등록된 운동이 없어요.'),el('span','추천 운동을 담거나 직접 추가해 보세요.'));$('plans').append(empty);return}list.forEach(p=>{const box=el('article',undefined,`plan${p.done?' done':''}`);const top=el('div',undefined,'plan-top');const info=el('div');info.append(el('h4',p.name),el('span',`${p.time||'시간 자유'} · ${p.minutes?`${p.minutes}분`:'휴식'}${p.place?' · '+p.place:''}`,'meta'));top.append(info,el('span',p.done?'완료':'예정','meta'));box.append(top);if(p.items.length){const ul=el('ul');p.items.forEach(x=>ul.append(el('li',`${x.name} — ${x.detail}`)));box.append(ul)}const actions=el('div',undefined,'plan-actions'),toggle=el('button',p.done?'완료 취소':'완료 표시','small secondary'),del=el('button','삭제','small delete');toggle.setAttribute('aria-label',p.name+' '+(p.done?'완료 취소':'완료 표시'));toggle.onclick=()=>{p.done=!p.done;persist();render()};del.setAttribute('aria-label',p.name+' 삭제');del.onclick=()=>{if(!confirm('이 운동 일정을 삭제할까요?'))return;records=records.filter(x=>x.id!==p.id);persist();render();notify('일정을 삭제했어요.')};actions.append(toggle,del);box.append(actions);$('plans').append(box)})}
$('todayLabel').textContent=now.toLocaleDateString('ko-KR',{month:'long',day:'numeric',weekday:'long'});
$('recommend').onclick=recommend;
$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);renderCalendar()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);renderCalendar()};$('goToday').onclick=()=>{selected=today;view=new Date(now.getFullYear(),now.getMonth(),1);render()};
$('customForm').onsubmit=e=>{e.preventDefault();const name=$('customName').value.trim();if(!name){$('customName').setCustomValidity('운동 이름을 입력하세요.');$('customName').reportValidity();return}add({name,minutes:Number($('customMinutes').value),time:$('customTime').value,items:[],place:'',done:false});$('customName').value=''};$('customName').oninput=()=>$('customName').setCustomValidity('');
recommend();render();
</script>
</body>
</html>
